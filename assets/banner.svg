<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'DejaVu Sans Mono','Courier New',ui-monospace,monospace">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#1a1440"/><stop offset="55%" stop-color="#0d0a1f"/><stop offset="100%" stop-color="#070510"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="48%" r="60%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="g" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="16"/></filter>
    <radialGradient id="cy" cx="38%" cy="34%" r="68%"><stop offset="0%" stop-color="#d6f6ff"/><stop offset="45%" stop-color="#39d6ff"/><stop offset="100%" stop-color="#0a6b8f"/></radialGradient>
    <radialGradient id="mg" cx="38%" cy="34%" r="68%"><stop offset="0%" stop-color="#ffd6f4"/><stop offset="45%" stop-color="#ff4fd8"/><stop offset="100%" stop-color="#8f1c74"/></radialGradient>
    <radialGradient id="yl" cx="38%" cy="34%" r="68%"><stop offset="0%" stop-color="#fff2c4"/><stop offset="45%" stop-color="#ffd23f"/><stop offset="100%" stop-color="#8f6a12"/></radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#efd8a4"/><stop offset="55%" stop-color="#c9a86a"/><stop offset="100%" stop-color="#9c8047"/></linearGradient>
    <linearGradient id="tcy" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#39d6ff" stop-opacity="0"/><stop offset="100%" stop-color="#39d6ff"/></linearGradient>
    <linearGradient id="tmg" x1="1" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ff4fd8" stop-opacity="0"/><stop offset="100%" stop-color="#ff4fd8"/></linearGradient>
    <linearGradient id="tyl" x1="1" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#ffd23f" stop-opacity="0"/><stop offset="100%" stop-color="#ffd23f"/></linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <g stroke="#7a5ac0" stroke-opacity="0.05" stroke-width="1">
    <path d="M40 0V630M80 0V630M120 0V630M160 0V630M200 0V630M240 0V630M280 0V630M320 0V630M360 0V630M400 0V630M440 0V630M480 0V630M520 0V630M560 0V630M600 0V630M640 0V630M680 0V630M720 0V630M760 0V630M800 0V630M840 0V630M880 0V630M920 0V630M960 0V630M1000 0V630M1040 0V630M1080 0V630M1120 0V630M1160 0V630"/>
    <path d="M0 40H1200M0 80H1200M0 120H1200M0 160H1200M0 200H1200M0 240H1200M0 280H1200M0 320H1200M0 360H1200M0 400H1200M0 440H1200M0 480H1200M0 520H1200M0 560H1200M0 600H1200"/>
  </g>

  <!-- trails -->
  <g fill="none" stroke-linecap="round" filter="url(#g)">
    <path d="M150 120 Q400 160 600 250" stroke="url(#tcy)" stroke-width="6" opacity="0.85"/>
    <path d="M1080 150 Q820 210 700 285" stroke="url(#tmg)" stroke-width="6" opacity="0.85"/>
    <path d="M120 520 Q380 470 560 300" stroke="url(#tyl)" stroke-width="6" opacity="0.85"/>
  </g>

  <!-- trinity orbs around the title -->
  <g>
    <circle cx="600" cy="250" r="40" fill="#39d6ff" filter="url(#soft)" opacity="0.5"/><circle cx="600" cy="250" r="24" fill="url(#cy)"/><circle cx="591" cy="241" r="8" fill="#fff" opacity="0.5"/>
    <circle cx="700" cy="288" r="40" fill="#ff4fd8" filter="url(#soft)" opacity="0.5"/><circle cx="700" cy="288" r="24" fill="url(#mg)"/><circle cx="691" cy="279" r="8" fill="#fff" opacity="0.45"/>
    <circle cx="558" cy="300" r="40" fill="#ffd23f" filter="url(#soft)" opacity="0.5"/><circle cx="558" cy="300" r="24" fill="url(#yl)"/><circle cx="549" cy="291" r="8" fill="#fff" opacity="0.45"/>
  </g>

  <g text-anchor="middle">
    <text x="600" y="440" font-size="98" font-weight="700" letter-spacing="10" fill="#7a683f" opacity="0.4" filter="url(#soft)">KICKOFF</text>
    <text x="600" y="440" font-size="98" font-weight="700" letter-spacing="10" fill="url(#brass)" filter="url(#g)">KICKOFF</text>
    <text x="604" y="512" font-size="64" font-weight="700" letter-spacing="34" fill="#cfe9ff">TRINITY</text>
    <text x="600" y="560" font-size="20" letter-spacing="6" fill="#9a92cf">EVERY BALL HAS ITS OWN CLOCK · BEND TIME · KICK OFF · WIN</text>
    <text x="600" y="596" font-size="15" letter-spacing="4" fill="#c9a86a">movfuscators &#183; a &quot;Kickoff&quot; game jam entry</text>
  </g>

  <rect width="1200" height="630" fill="url(#vig)"/>
</svg>
